<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New password — Dites</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <script src="/assets/js/theme-init.js?v=f114d21d"></script>
  <link rel="stylesheet" href="/assets/css/style.css?v=f114d21d">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/en/" aria-label="Dites"><svg class="brand-mark" viewBox="0 0 24 14" aria-hidden="true"><rect x="0.75" y="0.75" width="22.5" height="12.5" rx="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><g fill="currentColor"><rect x="5.2" y="5.75" width="1.6" height="2.5" rx="0.8"/><rect x="8.2" y="4.5" width="1.6" height="5" rx="0.8"/><rect x="11.2" y="3.75" width="1.6" height="6.5" rx="0.8"/><rect x="14.2" y="5" width="1.6" height="4" rx="0.8"/><rect x="17.2" y="6" width="1.6" height="2" rx="0.8"/></g></svg><span>Dites</span></a>
      <p class="lang-switch account-lang" aria-label="Language">
        <a href="/compte/mot-de-passe" lang="fr" hreflang="fr">FR</a>
      </p>
    </div>
  </header>
  <main class="section account" data-account="password" data-msg-success="Password changed. Go back to Dites and sign in with your new password." data-msg-expired="Link expired: request a new email from Dites." data-msg-weak="Password too weak: at least 8 characters, with letters and numbers." data-msg-mismatch="The two passwords don't match." data-msg-same="Choose a password different from your old one." data-msg-sending="Saving…" data-msg-failed="The password couldn't be changed. Try again in a moment." data-msg-network="Can't connect. Check your internet connection, then try again.">
    <div class="container narrow">
      <span class="label">Dites account</span>
      <h1>New password</h1>
      <form class="account-form" novalidate>
        <label class="field-label" for="password">New password</label>
        <input class="field-input" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="password-hint">
        <p class="field-hint" id="password-hint">At least 8 characters, with letters and numbers.</p>
        <label class="field-label" for="confirm">Confirm</label>
        <input class="field-input" id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required>
        <button class="btn btn-primary" type="submit">Change password</button>
      </form>
      <p class="account-status" data-status role="status" aria-live="polite"></p>
      <noscript><p class="account-status" data-kind="error">Turn on JavaScript to continue.</p></noscript>
    </div>
  </main>
  <script src="/assets/js/account.js?v=f114d21d"></script>
</body>
</html>
